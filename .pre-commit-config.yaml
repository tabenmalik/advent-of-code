repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: end-of-file-fixer
    -   id: requirements-txt-fixer
    -   id: trailing-whitespace
    -   id: file-contents-sorter
        files: \.gitignore$
        args: [--unique]
-   repo: https://github.com/asottile/reorder-python-imports
    rev: v3.17.0
    hooks:
    -   id: reorder-python-imports
        args: [--py310-plus, --add-import, 'from __future__ import annotations']
-   repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
    -   id: add-trailing-comma
-   repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
    -   id: pyupgrade
        args: [--py313-plus]
-   repo: https://github.com/hhatto/autopep8
    rev: v2.3.2
    hooks:
    -   id: autopep8
-   repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
    -   id: flake8
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
    -   id: mypy
    -   id: mypy
        name: mypy strict
        args: [--config-file, pyproject.toml, --cache-dir, .mypy_strict_cache]
        additional_dependencies: [pytest]
        exclude: |
            (?x)(
                ^2015/.*$
                | ^aoc_test.py$
                | ^2025/day01part1.py$
                | ^2025/day01part2.py$
                | ^2025/day02part1.py$
                | ^2025/day02part2.py$
                | ^2025/day03part1.py$
                | ^2025/day03part2.py$
                | ^2025/day04part1.py$
                | ^2025/day04part2.py$
                | ^2025/day05part1.py$
                | ^2025/day05part2.py$
                | ^2025/day06part1.py$
                | ^2025/day06part2.py$
                | ^2025/day07part1.py$
                | ^2025/day07part2.py$
            )
